[package]
name = "portfolio-monitor"
version = "0.1.0"
edition = "2021"
description = "Kalshi / Polymarket portfolio monitoring (desk_events mapping, official APIs)"

[lib]
name = "portfolio_monitor"
path = "src/lib.rs"

[[bin]]
name = "portfolio-snapshot"
path = "src/bin/snapshot.rs"

[[bin]]
name = "portfolio-cashflow"
path = "src/bin/cashflow.rs"

[[bin]]
name = "portfolio-profit"
path = "src/bin/profit.rs"

[[bin]]
name = "portfolio-turnover"
path = "src/bin/turnover.rs"

[[bin]]
name = "portfolio-pm-redeem-diagnose"
path = "src/bin/pm_redeem_diagnose.rs"

[[bin]]
name = "arb-reconcile"
path = "src/bin/arb_reconcile.rs"

[[bin]]
name = "portfolio-position-markets"
path = "src/bin/position_markets.rs"

[[bin]]
name = "close-position"
path = "src/bin/close_position.rs"

[[bin]]
name = "pm-wrap-collateral"
path = "src/bin/pm_wrap_collateral.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
rand = "0.8"
polymarket_client_sdk_v2 = { version = "0.5.1", features = ["clob", "data", "ctf"] }
# 与 polymarket-client-sdk 的 CTF 示例一致：Provider + 本地签名发链上 redeem
alloy = { version = "1.6.3", default-features = false, features = [
    "signer-local",
    "sol-types",
    "std",
] }
alloy-signer-local = "1.8"
rust_decimal = "1"
plotters = { version = "0.3", features = ["chrono"] }
hex = "0.4"
