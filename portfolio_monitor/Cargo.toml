[package]
name = "portfolio-monitor"
version = "0.1.0"
edition = "2021"
description = "TOML-mapped Kalshi / Polymarket portfolio monitoring (official APIs)"

[lib]
name = "portfolio_monitor"
path = "src/lib.rs"

[[bin]]
name = "portfolio-overview"
path = "src/bin/overview.rs"

[[bin]]
name = "portfolio-pairs"
path = "src/bin/pairs.rs"

[[bin]]
name = "portfolio-settled"
path = "src/bin/settled.rs"

[[bin]]
name = "portfolio-charts"
path = "src/bin/charts.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
rand = "0.8"
polymarket-client-sdk = { version = "0.4.4", features = ["clob"] }
alloy-signer-local = "1.8"
plotters = { version = "0.3", features = ["chrono"] }
