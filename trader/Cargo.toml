[[bin]]
name = "check_env"
path = "src/bin/check_env.rs"

[[bin]]
name = "pm_redeem"
path = "src/bin/pm_redeem.rs"

[package]
name = "trader"
version = "0.1.0"
edition = "2021"
default-run = "trader"

[dependencies]

portfolio-monitor = { path = "../portfolio_monitor" }
humantime = "2.1.0"
# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4", features = ["derive", "env"] }

# Time handling with Serde support
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Text processing
rust-stemmers = "1.2.0"
regex = "1.10"

# Numerical computing
ndarray = "0.15.6"

# String similarity
strsim = "0.10"

# Concurrency
futures = "0.3"
rayon = "1.10"

# Matching, signing and venue integrations
toml = "0.8"
once_cell = "1.19"
uuid = { version = "1.10", features = ["v4"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
polymarket_client_sdk_v2 = { version = "0.5.1", features = ["clob"] }
alloy-signer-local = "1.8"
rust_decimal = "1.39"
rust_decimal_macros = "1.39"

[dev-dependencies]
rand = "0.8"
