[package]
name = "backtest"
version = "0.1.0"
edition = "2021"
description = "事后读取 paper_trades.csv，按 UTC 日历与 session 交互式汇总绩效"

[[bin]]
name = "backtest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dialoguer = "0.11"
unicode-width = "0.2"
