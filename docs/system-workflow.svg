<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Prediction-market arbitrage operating workflow</title>
  <desc id="desc">Three lanes show contract discovery, opportunity evaluation, concurrent execution, reconciliation, and portfolio review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14213d" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#52627a"/></marker>
    <style>
      .lane{fill:#f7f9fc;stroke:#dbe3ee;stroke-width:1.5}.source{fill:#fff;stroke:#7b8aa2;stroke-width:1.5;filter:url(#shadow)}
      .analysis{fill:#eaf3ff;stroke:#3878c7;stroke-width:1.6;filter:url(#shadow)}.control{fill:#ecf8f5;stroke:#238777;stroke-width:1.6;filter:url(#shadow)}
      .recovery{fill:#fff0ed;stroke:#d45c4d;stroke-width:1.6;filter:url(#shadow)}.store{fill:#f3efff;stroke:#7a61b8;stroke-width:1.6;filter:url(#shadow)}
      .heading{font:700 22px Arial,sans-serif;fill:#17243a}.step{font:700 17px Arial,sans-serif;fill:#17243a;text-anchor:middle}.detail{font:14px Arial,sans-serif;fill:#47556b;text-anchor:middle}
      .number{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.flow{fill:none;stroke:#52627a;stroke-width:2.2;marker-end:url(#arrow)}
      .note{font:13px Arial,sans-serif;fill:#6a7485}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#fff"/>
  <rect class="lane" x="40" y="38" width="1360" height="238" rx="16"/><text class="heading" x="72" y="78">1 · Establish contract equivalence</text>
  <circle cx="118" cy="147" r="18" fill="#3878c7"/><text class="number" x="118" y="147">1</text>
  <rect class="source" x="155" y="105" width="220" height="86" rx="10"/><text class="step" x="265" y="140">Venue catalogs</text><text class="detail" x="265" y="165">Kalshi + Polymarket</text>
  <rect class="analysis" x="435" y="105" width="220" height="86" rx="10"/><text class="step" x="545" y="140">Category TF-IDF</text><text class="detail" x="545" y="165">exact cosine retrieval</text>
  <rect class="control" x="715" y="105" width="220" height="86" rx="10"/><text class="step" x="825" y="140">Rule screen</text><text class="detail" x="825" y="165">event, date, settlement</text>
  <rect class="control" x="995" y="105" width="220" height="86" rx="10"/><text class="step" x="1105" y="140">Semantic review</text><text class="detail" x="1105" y="165">DeepSeek when enabled</text>
  <rect class="analysis" x="1260" y="105" width="105" height="86" rx="10"/><text class="step" x="1312" y="140">Pair</text><text class="detail" x="1312" y="165">retained</text>
  <path class="flow" d="M375 148 H423"/><path class="flow" d="M655 148 H703"/><path class="flow" d="M935 148 H983"/><path class="flow" d="M1215 148 H1248"/>
  <text class="note" x="155" y="228">Candidates rejected at any screen do not enter live tracking.</text>
  <rect class="lane" x="40" y="304" width="1360" height="274" rx="16"/><text class="heading" x="72" y="344">2 · Price executable hedge bundles</text>
  <circle cx="118" cy="421" r="18" fill="#3878c7"/><text class="number" x="118" y="421">2</text>
  <rect class="analysis" x="155" y="378" width="220" height="86" rx="10"/><text class="step" x="265" y="413">Two orientations</text><text class="detail" x="265" y="438">YES/NO and NO/YES</text>
  <rect class="source" x="435" y="378" width="220" height="86" rx="10"/><text class="step" x="545" y="413">Visible ask ladders</text><text class="detail" x="545" y="438">both venues, full depth</text>
  <rect class="analysis" x="715" y="378" width="220" height="86" rx="10"/><text class="step" x="825" y="413">Common quantity</text><text class="detail" x="825" y="438">depth-weighted limits</text>
  <rect class="control" x="995" y="378" width="220" height="86" rx="10"/><text class="step" x="1105" y="413">Economics + risk</text><text class="detail" x="1105" y="438">fees, buffer, capital</text>
  <rect class="control" x="1260" y="378" width="105" height="86" rx="10"/><text class="step" x="1312" y="413">Gate</text><text class="detail" x="1312" y="438">pass</text>
  <path class="flow" d="M375 421 H423"/><path class="flow" d="M655 421 H703"/><path class="flow" d="M935 421 H983"/><path class="flow" d="M1215 421 H1248"/>
  <text class="note" x="155" y="510">The detector emits an opportunity only when both legs support one quantity and the post-cost threshold is met.</text>
  <rect class="lane" x="40" y="606" width="1360" height="250" rx="16"/><text class="heading" x="72" y="646">3 · Execute, reconcile, and account</text>
  <circle cx="118" cy="733" r="18" fill="#238777"/><text class="number" x="118" y="733">3</text>
  <rect class="control" x="155" y="690" width="225" height="86" rx="10"/><text class="step" x="267" y="725">Concurrent submission</text><text class="detail" x="267" y="750">Kalshi IOC + PM FAK</text>
  <rect class="analysis" x="450" y="690" width="210" height="86" rx="10"/><text class="step" x="555" y="725">Fill comparison</text><text class="detail" x="555" y="750">matched vs. excess size</text>
  <rect class="recovery" x="730" y="690" width="210" height="86" rx="10"/><text class="step" x="835" y="725">Residual response</text><text class="detail" x="835" y="750">sell excess or record</text>
  <rect class="store" x="1010" y="690" width="180" height="86" rx="10"/><text class="step" x="1100" y="725">Desk records</text><text class="detail" x="1100" y="750">JSONL + round state</text>
  <rect class="store" x="1260" y="690" width="105" height="86" rx="10"/><text class="step" x="1312" y="725">Review</text><text class="detail" x="1312" y="750">P&amp;L</text>
  <path class="flow" d="M380 733 H438"/><path class="flow" d="M660 733 H718"/><path class="flow" d="M940 733 H998"/><path class="flow" d="M1190 733 H1248"/>
  <text class="note" x="450" y="820">Fill differences trigger compensating cleanup; cleanup is not an atomic rollback.</text>
  <rect x="930" y="866" width="14" height="14" rx="3" fill="#eaf3ff" stroke="#3878c7"/><text class="note" x="952" y="878">analysis</text><rect x="1015" y="866" width="14" height="14" rx="3" fill="#ecf8f5" stroke="#238777"/><text class="note" x="1037" y="878">control</text><rect x="1100" y="866" width="14" height="14" rx="3" fill="#fff0ed" stroke="#d45c4d"/><text class="note" x="1122" y="878">recovery</text><rect x="1195" y="866" width="14" height="14" rx="3" fill="#f3efff" stroke="#7a61b8"/><text class="note" x="1217" y="878">records</text>
</svg>
