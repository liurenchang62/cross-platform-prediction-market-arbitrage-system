<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Prediction-market arbitrage component architecture</title>
  <desc id="desc">Layered architecture separating integrations, contract intelligence, the trading runtime, persistence, and portfolio operations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14213d" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#637088"/></marker>
    <style>
      .panel{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.integration{fill:#fff;stroke:#7b8aa2;stroke-width:1.5;filter:url(#shadow)}.research{fill:#eaf3ff;stroke:#3878c7;stroke-width:1.6;filter:url(#shadow)}.runtime{fill:#ecf8f5;stroke:#238777;stroke-width:1.6;filter:url(#shadow)}.record{fill:#f3efff;stroke:#7a61b8;stroke-width:1.6;filter:url(#shadow)}.recovery{fill:#fff0ed;stroke:#d45c4d;stroke-width:1.6;filter:url(#shadow)}
      .heading{font:700 21px Arial,sans-serif;fill:#17243a}.label{font:700 16px Arial,sans-serif;fill:#17243a;text-anchor:middle}.small{font:13.5px Arial,sans-serif;fill:#47556b;text-anchor:middle}.flow{fill:none;stroke:#637088;stroke-width:2.1;marker-end:url(#arrow)}.bidirectional{fill:none;stroke:#637088;stroke-width:2.1;marker-start:url(#arrow);marker-end:url(#arrow)}.note{font:13px Arial,sans-serif;fill:#6a7485}
    </style>
  </defs>
  <rect width="1440" height="880" fill="#fff"/>
  <rect class="panel" x="40" y="35" width="1360" height="150" rx="16"/><text class="heading" x="70" y="72">External integrations</text>
  <rect class="integration" x="105" y="98" width="230" height="58" rx="9"/><text class="label" x="220" y="125">Kalshi REST APIs</text><text class="small" x="220" y="146">catalogs, books, orders</text><rect class="integration" x="430" y="98" width="230" height="58" rx="9"/><text class="label" x="545" y="125">Polymarket APIs</text><text class="small" x="545" y="146">catalogs, books, orders</text><rect class="integration" x="780" y="98" width="230" height="58" rx="9"/><text class="label" x="895" y="125">DeepSeek validation</text><text class="small" x="895" y="146">ambiguous pair review</text><rect class="integration" x="1105" y="98" width="230" height="58" rx="9"/><text class="label" x="1220" y="125">Feishu notifications</text><text class="small" x="1220" y="146">operational alerts</text>
  <rect class="panel" x="40" y="215" width="650" height="300" rx="16"/><text class="heading" x="70" y="252">Contract intelligence</text>
  <rect class="research" x="90" y="290" width="240" height="78" rx="10"/><text class="label" x="210" y="321">Catalog normalization</text><text class="small" x="210" y="345">shared binary-market model</text><rect class="research" x="400" y="290" width="240" height="78" rx="10"/><text class="label" x="520" y="321">Category vector index</text><text class="small" x="520" y="345">TF-IDF + matrix chunks</text><rect class="research" x="90" y="412" width="240" height="78" rx="10"/><text class="label" x="210" y="443">Deterministic validators</text><text class="small" x="210" y="467">semantics and resolution</text><rect class="research" x="400" y="412" width="240" height="78" rx="10"/><text class="label" x="520" y="443">Accepted pair registry</text><text class="small" x="520" y="467">two oriented hedge records</text>
  <path class="flow" d="M330 329 H388"/><path class="flow" d="M520 368 V400"/><path class="flow" d="M330 451 H388"/>
  <rect class="panel" x="750" y="215" width="650" height="300" rx="16"/><text class="heading" x="780" y="252">Trading runtime</text>
  <rect class="runtime" x="800" y="290" width="240" height="78" rx="10"/><text class="label" x="920" y="321">Tracking scheduler</text><text class="small" x="920" y="345">refresh + bounded concurrency</text><rect class="runtime" x="1110" y="290" width="240" height="78" rx="10"/><text class="label" x="1230" y="321">Order-book economics</text><text class="small" x="1230" y="345">depth, fees, common size</text><rect class="runtime" x="800" y="412" width="240" height="78" rx="10"/><text class="label" x="920" y="443">Execution controls</text><text class="small" x="920" y="467">live gate + capital limits</text><rect class="recovery" x="1110" y="412" width="240" height="78" rx="10"/><text class="label" x="1230" y="443">Fill reconciliation</text><text class="small" x="1230" y="467">excess-leg cleanup</text>
  <path class="flow" d="M1040 329 H1098"/><path class="flow" d="M1230 368 V400"/><path class="flow" d="M1040 451 H1098"/><path class="flow" d="M640 451 H705 V329 H788"/>
  <rect class="panel" x="40" y="555" width="1360" height="250" rx="16"/><text class="heading" x="70" y="592">State, audit trail, and post-trade operations</text>
  <rect class="record" x="105" y="635" width="250" height="88" rx="10"/><text class="label" x="230" y="669">Execution event log</text><text class="small" x="230" y="694">append-only desk JSONL</text><rect class="record" x="430" y="635" width="250" height="88" rx="10"/><text class="label" x="555" y="669">Persistent risk state</text><text class="small" x="555" y="694">rounds + residual exposure</text><rect class="record" x="760" y="635" width="250" height="88" rx="10"/><text class="label" x="885" y="669">Portfolio monitor</text><text class="small" x="885" y="694">positions, cash flow, turnover</text><rect class="record" x="1085" y="635" width="250" height="88" rx="10"/><text class="label" x="1210" y="669">Reconciliation reports</text><text class="small" x="1210" y="694">P&amp;L + settlement review</text>
  <path class="flow" d="M1230 490 V535 H230 V623"/><path class="flow" d="M1230 535 H555 V623"/><path class="flow" d="M680 679 H748"/><path class="flow" d="M1010 679 H1073"/>
  <rect x="790" y="838" width="14" height="14" rx="3" fill="#eaf3ff" stroke="#3878c7"/><text class="note" x="812" y="850">matching</text><rect x="890" y="838" width="14" height="14" rx="3" fill="#ecf8f5" stroke="#238777"/><text class="note" x="912" y="850">runtime</text><rect x="980" y="838" width="14" height="14" rx="3" fill="#fff0ed" stroke="#d45c4d"/><text class="note" x="1002" y="850">recovery</text><rect x="1080" y="838" width="14" height="14" rx="3" fill="#f3efff" stroke="#7a61b8"/><text class="note" x="1102" y="850">persistent state</text>
</svg>
